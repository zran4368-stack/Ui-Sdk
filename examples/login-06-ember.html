<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ember Studio Login</title>
    <link rel="stylesheet" href="../blazer.css">
    <link rel="stylesheet" href="./examples.css">
    <script type="module" src="../blazer.js"></script>
  </head>
  <body class="bz-theme example-page theme-ember">
    <a class="example-back" href="./index.html">Examples</a>
    <main class="example-login">
      <section class="bz-band bz-panel example-card bz-reflect" data-bz-tilt="9" data-bz-animate="pop">
        <div class="example-logo">B</div>
        <h1>Ember Studio</h1>
        <p>Login surface with warm reflections, crisp borders, and controlled glow.</p>
        <form class="example-form">
          <div class="example-field">
            <label for="email">Studio email</label>
            <input class="bz-input" id="email" type="email" placeholder="artist@studio.com">
          </div>
          <div class="example-field">
            <label for="password">Access key</label>
            <input class="bz-input" id="password" type="password" placeholder="Access key">
          </div>
          <button class="bz-btn bz-btn-primary" type="button" data-bz-ripple>Open studio</button>
          <button class="bz-btn google-visual" type="button" aria-disabled="true">
            <span class="google-mark" aria-hidden="true"></span>
            Continue with Google
          </button>
        </form>
      </section>
    </main>
    <div class="bz-noise" aria-hidden="true"></div>
  </body>
</html>
