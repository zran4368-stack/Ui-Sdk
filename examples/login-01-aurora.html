<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aurora Glass Login</title>
    <link rel="stylesheet" href="../blazer.css">
    <link rel="stylesheet" href="./examples.css">
    <script type="module" src="../blazer.js"></script>
  </head>
  <body class="bz-theme example-page theme-aurora">
    <a class="example-back" href="./index.html">Examples</a>
    <main class="example-login">
      <section class="bz-band bz-panel example-card bz-reflect" data-bz-tilt="7" data-bz-animate="rise">
        <div class="example-logo">B</div>
        <h1>Welcome back</h1>
        <p>Sign in to continue building luminous interfaces with Blazer CSS++.</p>
        <form class="example-form">
          <button class="bz-btn google-visual" type="button" aria-disabled="true">
            <span class="google-mark" aria-hidden="true"></span>
            Continue with Google
          </button>
          <div class="example-divider">or</div>
          <div class="example-field">
            <label for="email">Email</label>
            <input class="bz-input" id="email" type="email" placeholder="you@example.com">
          </div>
          <div class="example-field">
            <label for="password">Password</label>
            <input class="bz-input" id="password" type="password" placeholder="Password">
          </div>
          <button class="bz-btn bz-btn-primary" type="button" data-bz-ripple>Sign in</button>
        </form>
        <div class="example-meta">
          <span>New here?</span>
          <a href="#">Create account</a>
        </div>
      </section>
    </main>
    <div class="bz-noise" aria-hidden="true"></div>
  </body>
</html>
