<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orbit Login</title>
    <link rel="stylesheet" href="../blazer.css">
    <link rel="stylesheet" href="./examples.css">
    <script type="module" src="../blazer.js"></script>
  </head>
  <body class="bz-theme example-page theme-orbit">
    <a class="example-back" href="./index.html">Examples</a>
    <main class="example-login wide">
      <section class="bz-band example-copy bz-reflect" data-bz-animate="rise">
        <span class="bz-kicker">Orbit console</span>
        <h1 class="bz-gradient-text">Bring deep-space glass into auth.</h1>
        <p>Blazer CSS++ combines lighting tokens with small JavaScript behaviors for polished screens.</p>
      </section>
      <section class="bz-band bz-panel example-card" data-bz-tilt="7" data-bz-animate="rise" data-bz-delay="120">
        <div class="example-logo">B</div>
        <h2>Mission login</h2>
        <p>Enter your account details to continue.</p>
        <form class="example-form">
          <button class="bz-btn google-visual" type="button" aria-disabled="true">
            <span class="google-mark" aria-hidden="true"></span>
            Continue with Google
          </button>
          <div class="example-divider">or</div>
          <div class="example-field">
            <label for="email">Email</label>
            <input class="bz-input" id="email" type="email" placeholder="pilot@orbit.dev">
          </div>
          <button class="bz-btn bz-btn-primary" type="button" data-bz-ripple>Continue</button>
        </form>
      </section>
    </main>
    <div class="bz-noise" aria-hidden="true"></div>
  </body>
</html>
