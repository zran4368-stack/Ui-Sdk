<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Obsidian Split Login</title>
    <link rel="stylesheet" href="../blazer.css">
    <link rel="stylesheet" href="./examples.css">
    <script type="module" src="../blazer.js"></script>
  </head>
  <body class="bz-theme example-page theme-obsidian">
    <a class="example-back" href="./index.html">Examples</a>
    <main class="example-login wide">
      <section class="bz-band example-copy bz-reflect" data-bz-animate="blaze">
        <span class="bz-kicker">Secure workspace</span>
        <h1 class="bz-gradient-text">Operate from one reflective command center.</h1>
        <p>Blazer surfaces keep the interface sharp while glow and glass handle the mood.</p>
      </section>
      <section class="bz-band bz-panel example-card" data-bz-tilt="6" data-bz-animate="rise" data-bz-delay="140">
        <div class="example-logo">B</div>
        <h2>Sign in</h2>
        <p>Access your dashboard with a focused login flow.</p>
        <form class="example-form">
          <button class="bz-btn google-visual" type="button" aria-disabled="true">
            <span class="google-mark" aria-hidden="true"></span>
            Continue with Google
          </button>
          <div class="example-field">
            <label for="email">Work email</label>
            <input class="bz-input" id="email" type="email" placeholder="name@company.com">
          </div>
          <button class="bz-btn bz-btn-primary" type="button" data-bz-ripple>Continue</button>
        </form>
      </section>
    </main>
    <div class="bz-noise" aria-hidden="true"></div>
  </body>
</html>
