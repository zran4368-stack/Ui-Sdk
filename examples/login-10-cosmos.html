<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cosmos Login</title>
    <link rel="stylesheet" href="../blazer.css">
    <link rel="stylesheet" href="./examples.css">
    <script type="module" src="../blazer.js"></script>
  </head>
  <body class="bz-theme example-page theme-cosmos">
    <a class="example-back" href="./index.html">Examples</a>
    <main class="example-login wide">
      <section class="bz-card example-copy" data-bz-animate="pop">
        <span class="bz-chip" data-tone="violet">Cosmos skin</span>
        <h1 class="bz-gradient-text">Auth UI with depth, light, and motion.</h1>
        <p>The same CSS tokens can drive product surfaces, login screens, and admin panels.</p>
      </section>
      <section class="bz-band bz-panel example-card bz-reflect" data-bz-tilt="8" data-bz-animate="rise" data-bz-delay="160">
        <div class="example-logo">B</div>
        <h2>Return to Cosmos</h2>
        <p>Use your account to continue.</p>
        <form class="example-form">
          <div class="example-field">
            <label for="email">Email</label>
            <input class="bz-input" id="email" type="email" placeholder="you@cosmos.app">
          </div>
          <button class="bz-btn bz-btn-primary" type="button" data-bz-ripple>Continue</button>
          <div class="example-divider">or</div>
          <button class="bz-btn google-visual" type="button" aria-disabled="true">
            <span class="google-mark" aria-hidden="true"></span>
            Continue with Google
          </button>
        </form>
      </section>
    </main>
    <div class="bz-noise" aria-hidden="true"></div>
  </body>
</html>
