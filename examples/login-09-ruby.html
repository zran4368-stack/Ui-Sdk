<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ruby Vault Login</title>
    <link rel="stylesheet" href="../blazer.css">
    <link rel="stylesheet" href="./examples.css">
    <script type="module" src="../blazer.js"></script>
  </head>
  <body class="bz-theme example-page theme-ruby">
    <a class="example-back" href="./index.html">Examples</a>
    <main class="example-login">
      <section class="bz-band bz-panel example-card bz-reflect" data-bz-tilt="7" data-bz-animate="blaze">
        <div class="example-logo">B</div>
        <h1>Ruby Vault</h1>
        <p>Security-oriented glass login with sharp contrast and red highlight energy.</p>
        <form class="example-form">
          <button class="bz-btn google-visual" type="button" aria-disabled="true">
            <span class="google-mark" aria-hidden="true"></span>
            Continue with Google
          </button>
          <div class="example-divider">or vault key</div>
          <div class="example-field">
            <label for="email">Account</label>
            <input class="bz-input" id="email" type="email" placeholder="owner@vault.io">
          </div>
          <div class="example-field">
            <label for="password">Vault password</label>
            <input class="bz-input" id="password" type="password" placeholder="Password">
          </div>
          <button class="bz-btn bz-btn-primary" type="button" data-bz-ripple>Unlock</button>
        </form>
      </section>
    </main>
    <div class="bz-noise" aria-hidden="true"></div>
  </body>
</html>
