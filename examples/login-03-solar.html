<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solar Gate Login</title>
    <link rel="stylesheet" href="../blazer.css">
    <link rel="stylesheet" href="./examples.css">
    <script type="module" src="../blazer.js"></script>
  </head>
  <body class="bz-theme example-page theme-solar">
    <a class="example-back" href="./index.html">Examples</a>
    <main class="example-login">
      <section class="bz-card example-card bz-reflect" data-bz-tilt="8" data-bz-animate="pop">
        <div class="example-logo">B</div>
        <h1>Solar Gate</h1>
        <p>Warm gradient glass login for high-energy product surfaces.</p>
        <form class="example-form">
          <div class="example-field">
            <label for="email">Email address</label>
            <input class="bz-input" id="email" type="email" placeholder="hello@domain.com">
          </div>
          <div class="example-field">
            <label for="password">Password</label>
            <input class="bz-input" id="password" type="password" placeholder="Enter password">
          </div>
          <button class="bz-btn bz-btn-primary" type="button" data-bz-ripple>Enter</button>
          <div class="example-divider">or</div>
          <button class="bz-btn google-visual" type="button" aria-disabled="true">
            <span class="google-mark" aria-hidden="true"></span>
            Continue with Google
          </button>
        </form>
      </section>
    </main>
    <div class="bz-noise" aria-hidden="true"></div>
  </body>
</html>
