<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lagoon Login</title>
    <link rel="stylesheet" href="../blazer.css">
    <link rel="stylesheet" href="./examples.css">
    <script type="module" src="../blazer.js"></script>
  </head>
  <body class="bz-theme example-page theme-lagoon">
    <a class="example-back" href="./index.html">Examples</a>
    <main class="example-login wide">
      <section class="bz-band bz-panel example-card bz-reflect" data-bz-tilt="6" data-bz-animate="rise">
        <div class="example-logo">B</div>
        <h2>Log in to Lagoon</h2>
        <p>A calmer glass treatment for products that need clarity and depth.</p>
        <form class="example-form">
          <button class="bz-btn google-visual" type="button" aria-disabled="true">
            <span class="google-mark" aria-hidden="true"></span>
            Continue with Google
          </button>
          <div class="example-divider">or</div>
          <div class="example-field">
            <label for="email">Email</label>
            <input class="bz-input" id="email" type="email" placeholder="name@example.com">
          </div>
          <div class="example-field">
            <label for="password">Password</label>
            <input class="bz-input" id="password" type="password" placeholder="Password">
          </div>
          <button class="bz-btn bz-btn-primary" type="button" data-bz-ripple>Log in</button>
        </form>
      </section>
      <section class="bz-card example-copy" data-bz-animate="blaze" data-bz-delay="140">
        <span class="bz-chip" data-tone="blue">Glass auth</span>
        <h1 class="bz-gradient-text">Soft motion for daily workflows.</h1>
        <p>Use the same Blazer components for forms, tool panels, and onboarding screens.</p>
      </section>
    </main>
    <div class="bz-noise" aria-hidden="true"></div>
  </body>
</html>
